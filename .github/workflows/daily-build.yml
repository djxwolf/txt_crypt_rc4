name: Daily Build

on:
  schedule:
    # UTC 17:00 = Beijing Time 01:00 (next day)
    - cron: '0 17 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    name: Build CLI Tool
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt6
      run: |
        sudo apt-get update
        sudo apt-get install -y qt6-base-dev

    - name: Clean and create build directory
      run: |
        rm -rf build
        mkdir build

    - name: Configure CMake (CLI only)
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -S $GITHUB_WORKSPACE

    - name: Build CLI tool
      run: |
        make -C build txt_crypt_cli -j$(nproc)

    - name: Test CLI tool
      run: |
        echo "Hello, World!" > /tmp/test_input.txt
        build/txt_crypt_cli encrypt /tmp/test_input.txt /tmp/test_output.txt
        build/txt_crypt_cli decrypt /tmp/test_output.txt /tmp/test_decrypted.txt
        cat /tmp/test_decrypted.txt
        rm -f /tmp/test_*.txt

    - name: Upload CLI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: txt_crypt_cli-linux
        path: build/txt_crypt_cli

    - name: Build Summary
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ CLI tool built successfully" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Tests passed" >> $GITHUB_STEP_SUMMARY
        echo "- 📦 CLI artifact uploaded" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Note: GUI app skipped (requires X11, not suitable for CI)" >> $GITHUB_STEP_SUMMARY

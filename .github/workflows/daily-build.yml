name: Daily Build

on:
  schedule:
    # UTC 17:00 = Beijing Time 01:00 (next day)
    - cron: '0 17 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-linux:
    name: Build CLI Tool (Linux)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt6
      run: |
        sudo apt-get update
        sudo apt-get install -y qt6-base-dev

    - name: Clean and create build directory
      run: |
        rm -rf build
        mkdir build

    - name: Configure CMake (CLI only)
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -S $GITHUB_WORKSPACE

    - name: Build CLI tool
      run: |
        make -C build txt_crypt_cli -j$(nproc)

    - name: Test CLI tool
      run: |
        echo "Hello, World!" > /tmp/test_input.txt
        build/txt_crypt_cli encrypt /tmp/test_input.txt /tmp/test_output.txt
        build/txt_crypt_cli decrypt /tmp/test_output.txt /tmp/test_decrypted.txt
        cat /tmp/test_decrypted.txt
        rm -f /tmp/test_*.txt

    - name: Upload CLI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: txt_crypt_cli-linux
        path: build/txt_crypt_cli

  build-macos:
    name: Build CLI Tool (macOS)
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt6
      run: |
        brew install qt@6

    - name: Clean and create build directory
      run: |
        rm -rf build
        mkdir build

    - name: Configure CMake (CLI only)
      run: |
        export SDKROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
        cmake -B build -DCMAKE_BUILD_TYPE=Release -S $GITHUB_WORKSPACE \
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
          -DCMAKE_CXX_FLAGS="-isysroot $SDKROOT"

    - name: Build CLI tool
      run: |
        make -C build txt_crypt_cli -j$(sysctl -n hw.ncpu)

    - name: Test CLI tool
      run: |
        echo "Hello, World!" > /tmp/test_input.txt
        build/txt_crypt_cli encrypt /tmp/test_input.txt /tmp/test_output.txt
        build/txt_crypt_cli decrypt /tmp/test_output.txt /tmp/test_decrypted.txt
        cat /tmp/test_decrypted.txt
        rm -f /tmp/test_*.txt

    - name: Upload CLI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: txt_crypt_cli-macos
        path: build/txt_crypt_cli

  build-windows:
    name: Build CLI Tool (Windows)
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-qt6-base
          mingw-w64-x86_64-ninja

    - name: Clean and create build directory
      shell: msys2 {0}
      run: |
        rm -rf build
        mkdir build

    - name: Configure CMake
      shell: msys2 {0}
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -S $GITHUB_WORKSPACE -G Ninja

    - name: Build CLI tool
      shell: msys2 {0}
      run: |
        cmake --build build --target txt_crypt_cli

    - name: Test CLI tool
      shell: msys2 {0}
      run: |
        echo "Hello, World!" > test_input.txt
        ./build/txt_crypt_cli.exe encrypt test_input.txt test_output.txt
        ./build/txt_crypt_cli.exe decrypt test_output.txt test_decrypted.txt
        cat test_decrypted.txt
        rm -f test_*.txt

    - name: Upload CLI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: txt_crypt_cli-windows
        path: build/txt_crypt_cli.exe
